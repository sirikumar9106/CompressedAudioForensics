seed: 42
train_manifest: data/manifests/asvspoof2019_train.csv
dev_manifest: data/manifests/asvspoof2019_dev.csv
pretrained: models/pre_trained_DF_RawNet2.pth
cache_root: data/cache
codec: mp3
bitrate: 32k
perturbation: mulaw8
proj_dim: 256        # 128 native RawNet2 channels -> 256 so features are exactly 1,025-dim (null = 513-dim)
hidden: 256
dropout: 0.3
batch_size: 32
lr: 0.0001
weight_decay: 0.0001
epochs: 20
patience: 5
lambda_anchor: 0.0
